# The one-engine baseline for the two-engine experiment: the whole app on one engine at 50034,
# the same ports engine A uses, plus the probe worker. Start it with `npx tsx start.ts --single`
# from experiments/multi-engine, and never at the same time as engine-a and engine-b.
# Rewind's page is not built here, so the ADE shows its placeholder.
startup_timeout: 300s
stop_timeout: 10s

engine:
  url: ws://127.0.0.1:50034

containers:
  clock:
    worker: path://../../../workers/clock
    environment:
      PROVIDERS_PORT: "50036"
    scripts:
      pre_run: npm install --no-audit --no-fund
      pre_run_timeout: 3m

  model:
    worker: path://../../../workers/model
    environment:
      MODEL_SEED: "${MODEL_SEED:-412}"
    scripts:
      pre_run: npm install --no-audit --no-fund
      pre_run_timeout: 3m

  tools:
    worker: path://../../../workers/tools
    restart: always
    environment:
      EMAIL_URL: http://127.0.0.1:50036/email
    scripts:
      pre_run: uv venv --allow-existing --python 3.11 .venv && uv pip install --python .venv/bin/python -r requirements.txt
      pre_run_timeout: 3m

  probe:
    worker: path://../probe
    scripts:
      pre_run: npm install --no-audit --no-fund
      pre_run_timeout: 3m

  agent:
    worker: path://../../../workers/agent
    start_after: [clock, model, tools]
    environment:
      HOLIDAYS_URL: http://127.0.0.1:50036
    scripts:
      pre_run: npm install --no-audit --no-fund
      pre_run_timeout: 3m

  traffic:
    worker: path://../../../workers/traffic
    start_after: [agent]
    scripts:
      pre_run: npm install --no-audit --no-fund
      pre_run_timeout: 3m

  rewind:
    worker: path://../../../workers/rewind
    start_after: [agent]
    environment:
      HOLIDAYS_URL: http://127.0.0.1:50036
    scripts:
      pre_run: cargo build --release
      pre_run_timeout: 10m

  ade:
    worker: package://ade
    version: "1.9.72"
    config_override:
      http_host: 127.0.0.1
      http_port: 4033
