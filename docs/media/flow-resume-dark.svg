<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 718" width="520" height="718" role="img" aria-label="When the agent dies mid-run, the journal starts agent::run again on the restarted agent with the same workflow id, each finished step gets its saved result from the journal, and the step in flight is sent again with its idempotency key." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title>Resuming a durable run</title>
<desc>When the agent dies mid-run, the journal starts agent::run again on the restarted agent with the same workflow id, each finished step gets its saved result from the journal, and the step in flight is sent again with its idempotency key.</desc>
