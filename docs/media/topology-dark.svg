<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" role="img" aria-label="Rewind's topology: five app workers call each other through one iii engine, which reports every call to Rewind; Rewind replays runs in namespaces of their own.">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .bg { fill: #0d1117; }
  .engine { fill: #17152b; stroke: #3c3668; stroke-width: 1.5; }
  .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
  .accent { fill: #0c2724; stroke: #2dd4bf; stroke-width: 2; }
  .fork { fill: none; stroke: #2dd4bf; stroke-width: 1.5; stroke-dasharray: 6 5; }
  .provider { fill: #12161c; stroke: #59606a; stroke-width: 1.5; stroke-dasharray: 6 5; }
  .title { fill: #e6edf3; font-size: 16px; font-weight: 600; }
  .sub { fill: #9198a1; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .heading { fill: #e6edf3; font-size: 15px; font-weight: 600; }
  .heading-sub { fill: #9198a1; font-size: 13px; }
  .edge { stroke: #a3abb6; stroke-width: 1.8; fill: none; }
  .observe { stroke: #2dd4bf; stroke-width: 4; fill: none; }
  .http { stroke: #79808a; stroke-width: 1.8; fill: none; stroke-dasharray: 3 5; }
  .edge-label { fill: #9198a1; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .label-bg { fill: #0d1117; opacity: 0.92; }
  .badge { font-size: 10.5px; font-weight: 700; }
  .ts { fill: #7fb0ff; } .ts-fill { fill: #12233f; }
  .py { fill: #f0b955; } .py-fill { fill: #2d2210; }
  .rs { fill: #ff9c72; } .rs-fill { fill: #33190f; }
  .legend { fill: #9198a1; font-size: 13px; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3abb6"/></marker>
  <marker id="arrow-http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#79808a"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
</defs>
<rect width="1240" height="680" class="bg"/>

<rect x="450" y="36" width="760" height="410" rx="18" class="engine"/>
<text x="474" y="66" class="heading">iii engine</text><text x="556" y="66" class="heading-sub">namespace default · ws://127.0.0.1:49334</text>

<g><rect x="720" y="92" width="200" height="66" rx="12" class="card"/><rect x="876" y="102" width="34" height="18" rx="9" class="ts-fill"/><text x="893" y="115" class="badge ts" text-anchor="middle">TS</text>
<text x="736" y="122" class="title">traffic</text><text x="736" y="144" class="sub">traffic::burst</text></g>
<g><rect x="700" y="214" width="240" height="70" rx="12" class="card"/><rect x="896" y="224" width="34" height="18" rx="9" class="ts-fill"/><text x="913" y="237" class="badge ts" text-anchor="middle">TS</text>
<text x="716" y="244" class="title">agent</text><text x="716" y="266" class="sub">agent::run</text></g>
<g><rect x="476" y="352" width="210" height="66" rx="12" class="card"/><rect x="642" y="362" width="34" height="18" rx="9" class="ts-fill"/><text x="659" y="375" class="badge ts" text-anchor="middle">TS</text>
<text x="492" y="382" class="title">model</text><text x="492" y="404" class="sub">model::complete</text></g>
<g><rect x="720" y="352" width="200" height="66" rx="12" class="card"/><rect x="876" y="362" width="34" height="18" rx="9" class="ts-fill"/><text x="893" y="375" class="badge ts" text-anchor="middle">TS</text>
<text x="736" y="382" class="title">clock</text><text x="736" y="404" class="sub">clock::now</text></g>
<g><rect x="970" y="352" width="216" height="66" rx="12" class="card"/><rect x="1142" y="362" width="34" height="18" rx="9" class="py-fill"/><text x="1159" y="375" class="badge py" text-anchor="middle">PY</text>
<text x="986" y="382" class="title">tools</text><text x="986" y="404" class="sub">find-slot · email::send</text></g>

<path d="M820,158 L820,212" class="edge" marker-end="url(#arrow)"/><rect x="824.5" y="177" width="83" height="19" rx="5" class="label-bg"/><text x="866" y="191" class="edge-label" text-anchor="middle">agent::run</text>
<path d="M760,284 C740,320 620,320 590,350" class="edge" marker-end="url(#arrow)"/><rect x="581.25" y="305" width="117.5" height="19" rx="5" class="label-bg"/><text x="640" y="319" class="edge-label" text-anchor="middle">model::complete</text>
<path d="M812,284 L812,350" class="edge" marker-end="url(#arrow)"/><rect x="770.5" y="311" width="83" height="19" rx="5" class="label-bg"/><text x="812" y="325" class="edge-label" text-anchor="middle">clock::now</text>
<path d="M880,284 C910,320 1050,318 1075,350" class="edge" marker-end="url(#arrow)"/><rect x="1007.8" y="305" width="124.4" height="19" rx="5" class="label-bg"/><text x="1070" y="319" class="edge-label" text-anchor="middle">find-slot · send</text>

<rect x="790" y="512" width="400" height="66" rx="12" class="provider"/>
<text x="808" y="541" class="title">Fake holidays API + email provider</text>
<text x="808" y="563" class="sub">served by the clock worker on :49335</text>
<path d="M940,284 L944,510" class="http" marker-end="url(#arrow-http)"/>
<path d="M1078,418 L1062,510" class="http" marker-end="url(#arrow-http)"/>
<rect x="937.35" y="465" width="131.3" height="19" rx="5" class="label-bg"/><text x="1003" y="479" class="edge-label" text-anchor="middle">HTTP, outside iii</text>

<g><rect x="70" y="214" width="260" height="76" rx="12" class="accent"/><rect x="286" y="224" width="34" height="18" rx="9" class="rs-fill"/><text x="303" y="237" class="badge rs" text-anchor="middle">RS</text>
<text x="86" y="244" class="title">Rewind</text><text x="86" y="266" class="sub">records · replays · recovers</text></g>
<path d="M448,252 L340,252" class="observe" marker-end="url(#arrow-teal)"/><rect x="350.5" y="223" width="83" height="19" rx="5" class="label-bg"/><text x="392" y="237" class="edge-label" text-anchor="middle">every call</text>

<g><rect x="70" y="70" width="260" height="66" rx="12" class="card"/><rect x="286" y="80" width="34" height="18" rx="9" class="ts-fill"/><text x="303" y="93" class="badge ts" text-anchor="middle">TS</text>
<text x="86" y="100" class="title">iii console :3133</text><text x="86" y="122" class="sub">Rewind's page</text></g>
<path d="M200,136 L200,212" class="edge" marker-end="url(#arrow)"/><rect x="209.95" y="163" width="76.1" height="19" rx="5" class="label-bg"/><text x="248" y="177" class="edge-label" text-anchor="middle">rewind::*</text>

<rect x="40" y="376" width="340" height="190" rx="16" class="fork"/>
<text x="60" y="404" class="heading">namespace rewind-f1</text><text x="60" y="424" class="heading-sub">one per replay or fork</text>
<g><rect x="56" y="444" width="140" height="66" rx="12" class="card"/><rect x="152" y="454" width="34" height="18" rx="9" class="ts-fill"/><text x="169" y="467" class="badge ts" text-anchor="middle">TS</text>
<text x="72" y="474" class="title">copy</text><text x="72" y="496" class="sub">of the agent</text></g>
<g><rect x="212" y="444" width="156" height="66" rx="12" class="card"/>
<text x="228" y="474" class="title">stubs</text><text x="228" y="496" class="sub">recorded answers</text></g>
<path d="M196,477 L210,477" class="edge" marker-end="url(#arrow)"/>
<text x="60" y="546" class="heading-sub">every call the copy makes lands on a stub</text>
<path d="M200,290 L200,374" class="edge" marker-end="url(#arrow)"/><rect x="198.15" y="321" width="103.7" height="19" rx="5" class="label-bg"/><text x="250" y="335" class="edge-label" text-anchor="middle">starts copies</text>

<path d="M40,628 L80,628" class="edge"/><text x="90" y="632" class="legend">a call through the engine</text>
<path d="M300,628 L340,628" class="http"/><text x="350" y="632" class="legend">plain HTTP that bypasses iii, recorded by a preload</text>
<path d="M720,628 L760,628" class="observe"/><text x="770" y="632" class="legend">observers report every call to Rewind</text>
</svg>
