<text x="160" y="49" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d1b29">traffic</text>
<text x="160" y="65" text-anchor="middle" font-size="10.5" fill="#6a6780">the caller</text>
<rect x="215" y="30" width="90" height="46" rx="9" fill="#e6effc" stroke="#1d5fc4" stroke-width="1.5"/>
<text x="260" y="49" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d1b29">agent</text>
