<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" width="520" height="680" role="img" aria-label="agent::run reaches durable::wait, the journal leaves the step pending and the run waiting, and the agent returns pending and keeps nothing for it. When you approve it on Rewind's page, or its timeout comes due, the journal saves the value as the step's result and calls agent::run again with the same workflow id, and the run goes on from the wait." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title>Pausing a durable run</title>
<desc>agent::run reaches durable::wait, the journal leaves the step pending and the run waiting, and the agent returns pending and keeps nothing for it. When you approve it on Rewind's page, or its timeout comes due, the journal saves the value as the step's result and calls agent::run again with the same workflow id, and the run goes on from the wait.</desc>
