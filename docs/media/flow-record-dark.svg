<circle cx="260" cy="182" r="9.5" fill="#a3abb6"/>
<text x="260" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">3</text>
<line x1="372" y1="220" x2="450" y2="220" stroke="#a3abb6" stroke-width="2"/>
<path d="M458,220 L448,215 L448,225 z" fill="#a3abb6"/>
<rect x="372" y="200" width="133.64000000000001" height="15" rx="4" fill="#0d1117" opacity="0.94"/>
<text x="376" y="211.5" font-size="12" fill="#e6edf3">stores it in <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">events</tspan></text>
<circle cx="360" cy="220" r="9.5" fill="#a3abb6"/>
<text x="360" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">4</text>
<line x1="172" y1="258" x2="450" y2="258" stroke="#a3abb6" stroke-width="2"/>
<path d="M458,258 L448,253 L448,263 z" fill="#a3abb6"/>
<rect x="201.14" y="238" width="227.72" height="15" rx="4" fill="#0d1117" opacity="0.94"/>
<text x="205.14" y="249.5" font-size="12" fill="#e6edf3">preload appends to <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">captures.jsonl</tspan></text>
<circle cx="160" cy="258" r="9.5" fill="#a3abb6"/>
<text x="160" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">5</text>
<rect x="132.11999999999998" y="285" width="214.88000000000002" height="22" rx="6" fill="#0c2724" stroke="#2dd4bf" stroke-width="1.2"/>
<text x="139.11999999999998" y="300.5" font-size="12" fill="#e6edf3">reads new captures every 200 ms</text>
<circle cx="360" cy="296" r="9.5" fill="#a3abb6"/>
<text x="360" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">6</text>
<line x1="348" y1="334" x2="70" y2="334" stroke="#a3abb6" stroke-width="2"/>
<path d="M62,334 L72,329 L72,339 z" fill="#a3abb6"/>
<rect x="129.81" y="314" width="150.38" height="15" rx="4" fill="#0d1117" opacity="0.94"/>
<text x="133.81" y="325.5" font-size="12" fill="#e6edf3"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">rewind::changed</tspan> (run)</text>
<circle cx="360" cy="334" r="9.5" fill="#a3abb6"/>
<text x="360" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">7</text>
<line x1="72" y1="372" x2="350" y2="372" stroke="#f472b6" stroke-width="2.6" stroke-dasharray="0.5 5.5" stroke-linecap="round"/>
<path d="M349,367 L358,372 L349,377" fill="none" stroke="#f472b6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="86.71000000000001" y="352" width="256.58" height="15" rx="4" fill="#0d1117" opacity="0.94"/>
<text x="90.71000000000001" y="363.5" font-size="12" fill="#e6edf3">recording menu: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">rewind::record-toggle</tspan></text>
<circle cx="60" cy="372" r="9.5" fill="#f472b6"/>
<text x="60" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">8</text>
<line x1="12" y1="412" x2="30" y2="412" stroke="#a3abb6" stroke-width="2"/>
<path d="M39,412 L30,407.5 L30,416.5 z" fill="#a3abb6"/>
<text x="44" y="416" font-size="11.5" fill="#9198a1">live call</text>
<line x1="117.89000000000001" y1="412" x2="135.89000000000001" y2="412" stroke="#f472b6" stroke-width="2.6" stroke-dasharray="0.5 5.5" stroke-linecap="round"/>
<path d="M135.89000000000001,407.5 L143.89000000000001,412 L135.89000000000001,416.5" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="149.89000000000001" y="416" font-size="11.5" fill="#9198a1">a person's action</text>
<rect x="12" y="427" width="16" height="12" rx="3" fill="#1b1f26" stroke="#79808a" stroke-width="1.3"/>
<text x="34" y="438" font-size="11.5" fill="#9198a1">person</text>
<rect x="89.26" y="427" width="16" height="12" rx="3" fill="#12233f" stroke="#7fb0ff" stroke-width="1.3"/>
<text x="111.26" y="438" font-size="11.5" fill="#9198a1">app worker</text>
<rect x="191.36" y="427" width="16" height="12" rx="3" fill="#0c2724" stroke="#2dd4bf" stroke-width="1.3"/>
<text x="213.36" y="438" font-size="11.5" fill="#9198a1">Rewind</text>
<rect x="268.62" y="427" width="16" height="12" rx="3" fill="#17152b" stroke="#3c3668" stroke-width="1.3"/>
<text x="290.62" y="438" font-size="11.5" fill="#9198a1">iii engine namespace</text>
