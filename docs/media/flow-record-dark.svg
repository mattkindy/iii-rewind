<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 452" width="520" height="452" role="img" aria-label="The agent's calls run on the live workers as usual, the engine hands each finished call to rewind::record, and Rewind stores it with the requests the preload wrote to the capture file and tells the page." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title>Recording a run</title>
<desc>The agent's calls run on the live workers as usual, the engine hands each finished call to rewind::record, and Rewind stores it with the requests the preload wrote to the capture file and tells the page.</desc>
<rect width="520" height="452" fill="#0d1117"/>
<rect x="112" y="8" width="296" height="73" rx="11" fill="#17152b" stroke="#3c3668" stroke-width="1.2"/>
<text x="121" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#a99cf5">default</text>
<line x1="60" y1="76" x2="60" y2="390" stroke="#272d37" stroke-width="1.5"/>
<line x1="160" y1="76" x2="160" y2="390" stroke="#272d37" stroke-width="1.5"/>
<line x1="260" y1="76" x2="260" y2="390" stroke="#272d37" stroke-width="1.5"/>
<line x1="360" y1="76" x2="360" y2="390" stroke="#272d37" stroke-width="1.5"/>
<line x1="460" y1="76" x2="460" y2="390" stroke="#272d37" stroke-width="1.5"/>
<rect x="15" y="30" width="90" height="46" rx="9" fill="#1b1f26" stroke="#79808a" stroke-width="1.5"/>
<text x="60" y="49" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">You</text>
<text x="60" y="65" text-anchor="middle" font-size="10.5" fill="#9198a1">Rewind's page</text>
<rect x="115" y="30" width="90" height="46" rx="9" fill="#12233f" stroke="#7fb0ff" stroke-width="1.5"/>
<text x="160" y="49" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">agent</text>
<text x="160" y="65" text-anchor="middle" font-size="10.5" fill="#9198a1">+ preload</text>
<rect x="215" y="30" width="90" height="46" rx="9" fill="#12233f" stroke="#7fb0ff" stroke-width="1.5"/>
<text x="260" y="49" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">callees</text>
<text x="260" y="65" text-anchor="middle" font-size="10.5" fill="#9198a1">model, tools</text>
<rect x="315" y="30" width="90" height="46" rx="9" fill="#0c2724" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="360" y="49" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">Rewind</text>
<text x="360" y="65" text-anchor="middle" font-size="10.5" fill="#9198a1">the worker</text>
<rect x="415" y="30" width="90" height="46" rx="9" fill="#0c2724" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="460" y="49" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">store</text>
<text x="460" y="65" text-anchor="middle" font-size="10.5" fill="#9198a1"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">data/</tspan></text>
<rect x="119.16" y="95" width="227.84" height="22" rx="6" fill="#0c2724" stroke="#2dd4bf" stroke-width="1.2"/>
<text x="126.16" y="110.5" font-size="12" fill="#e6edf3">observes each function it records</text>
<circle cx="360" cy="106" r="9.5" fill="#a3abb6"/>
<text x="360" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">1</text>
<line x1="172" y1="144" x2="250" y2="144" stroke="#a3abb6" stroke-width="2"/>
<path d="M258,144 L248,139 L248,149 z" fill="#a3abb6"/>
<rect x="172" y="124" width="111.49999999999999" height="15" rx="4" fill="#0d1117" opacity="0.94"/>
<text x="176" y="135.5" font-size="12" fill="#e6edf3"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">model::complete</tspan></text>
<circle cx="160" cy="144" r="9.5" fill="#a3abb6"/>
<text x="160" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">2</text>
<line x1="272" y1="182" x2="350" y2="182" stroke="#a3abb6" stroke-width="2"/>
<path d="M358,182 L348,177 L348,187 z" fill="#a3abb6"/>
<rect x="272" y="162" width="188.84" height="15" rx="4" fill="#0d1117" opacity="0.94"/>
