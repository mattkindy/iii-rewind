<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 528" width="520" height="528" role="img" aria-label="You save a finished fork as a JSON file in tests/rewind, and running it starts a copy of the agent that gets only the saved answers and says whether it ended the way the file expects." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title>Saving a fork as a test and running it</title>
