<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 644" width="520" height="644" role="img" aria-label="You check a group of runs, and Rewind replays each one in turn on one copy of the agent in rewind-c&lt;n&gt;, stopping at the first call the recording lacks unless the check is live, and reports same, different or stopped for each." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
