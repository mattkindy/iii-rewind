<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Each iii engine has a recorder that sends batches of calls to a Kafka log partitioned by run; store workers write the log to ClickHouse and object storage; replay pools on each engine read runs and save fork state in YugabyteDB through the store workers; the UI and query worker reads both stores and starts replays.">
<defs>
  <marker id="arrow-rec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <marker id="arrow-rep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
</defs>
<rect width="1200" height="760" fill="#ffffff"/>

<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

<rect x="60" y="24" width="370" height="276" rx="18" fill="#f5f3ff" stroke="#c4bdf0" stroke-width="1.5"/>
<text x="82" y="52" fill="#1d1b29" font-size="15" font-weight="600">iii engine, region A</text>
<rect x="80" y="70" width="160" height="90" rx="12" fill="#ffffff" stroke="#d8d5e6" stroke-width="1.5"/>
<text x="96" y="100" fill="#1d1b29" font-size="16" font-weight="600">App workers</text>
<text x="96" y="122" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">agent, tools,</text>
<text x="96" y="140" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">with preloads</text>
<rect x="260" y="70" width="150" height="90" rx="12" fill="#e7f7f4" stroke="#0f766e" stroke-width="2"/>
<text x="276" y="100" fill="#1d1b29" font-size="16" font-weight="600">Recorder</text>
<text x="276" y="122" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">observer target,</text>
<text x="276" y="140" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">batches by run</text>
<rect x="80" y="184" width="330" height="96" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="96" y="214" fill="#1d1b29" font-size="16" font-weight="600">Replay pool</text>
<text x="96" y="236" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">copies in rewind-f&lt;n&gt; for forks,</text>
<text x="96" y="254" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">checks and recoveries, stubs</text>

<rect x="60" y="330" width="370" height="276" rx="18" fill="#f5f3ff" stroke="#c4bdf0" stroke-width="1.5"/>
<text x="82" y="358" fill="#1d1b29" font-size="15" font-weight="600">iii engine, region B, and more</text>
<rect x="80" y="376" width="160" height="90" rx="12" fill="#ffffff" stroke="#d8d5e6" stroke-width="1.5"/>
<text x="96" y="406" fill="#1d1b29" font-size="16" font-weight="600">App workers</text>
<text x="96" y="428" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the same app,</text>
<text x="96" y="446" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">another customer</text>
<rect x="260" y="376" width="150" height="90" rx="12" fill="#e7f7f4" stroke="#0f766e" stroke-width="2"/>
<text x="276" y="406" fill="#1d1b29" font-size="16" font-weight="600">Recorder</text>
<text x="276" y="428" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">one active,</text>
<text x="276" y="446" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">one standby</text>
<rect x="80" y="490" width="330" height="96" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="96" y="520" fill="#1d1b29" font-size="16" font-weight="600">Replay pool</text>
<text x="96" y="542" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">near the engine, because copies</text>
<text x="96" y="560" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">need the workers' code</text>

<rect x="480" y="270" width="190" height="84" rx="12" fill="#e7f7f4" stroke="#0f766e" stroke-width="2"/>
<text x="496" y="302" fill="#1d1b29" font-size="16" font-weight="600">Kafka call log</text>
<text x="496" y="326" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">partitioned by run</text>

<rect x="730" y="270" width="190" height="84" rx="12" fill="#ffffff" stroke="#d8d5e6" stroke-width="1.5"/>
<text x="746" y="302" fill="#1d1b29" font-size="16" font-weight="600">Store workers</text>
<text x="746" y="326" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">stateless, any run</text>

<rect x="968" y="56" width="208" height="104" rx="12" fill="#ffffff" stroke="#d8d5e6" stroke-width="1.5"/>
<text x="984" y="86" fill="#1d1b29" font-size="16" font-weight="600">ClickHouse</text>
<text x="984" y="108" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">call log, runs list,</text>
<text x="984" y="126" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">failure groups,</text>
<text x="984" y="144" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">search</text>

<rect x="968" y="260" width="208" height="104" rx="12" fill="#ffffff" stroke="#d8d5e6" stroke-width="1.5"/>
<text x="984" y="290" fill="#1d1b29" font-size="16" font-weight="600">YugabyteDB</text>
<text x="984" y="312" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">forks, recoveries,</text>
<text x="984" y="330" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">send intents,</text>
<text x="984" y="348" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">leases</text>

<rect x="968" y="464" width="208" height="104" rx="12" fill="#ffffff" stroke="#d8d5e6" stroke-width="1.5"/>
<text x="984" y="494" fill="#1d1b29" font-size="16" font-weight="600">Object storage</text>
<text x="984" y="516" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">large bodies,</text>
<text x="984" y="534" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">old runs as</text>
<text x="984" y="552" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Parquet</text>

<rect x="480" y="640" width="250" height="84" rx="12" fill="#ffffff" stroke="#d8d5e6" stroke-width="1.5"/>
<text x="496" y="672" fill="#1d1b29" font-size="16" font-weight="600">UI and query worker</text>
<text x="496" y="696" fill="#6a6780" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">page, lists, search</text>

<path d="M240,115 H254" fill="none" stroke="#0f766e" stroke-width="3.5" marker-end="url(#arrow-rec)"/>
<path d="M240,421 H254" fill="none" stroke="#0f766e" stroke-width="3.5" marker-end="url(#arrow-rec)"/>
<path d="M410,115 C455,115 470,190 520,264" fill="none" stroke="#0f766e" stroke-width="3.5" marker-end="url(#arrow-rec)"/>
<path d="M410,421 C455,421 470,400 520,360" fill="none" stroke="#0f766e" stroke-width="3.5" marker-end="url(#arrow-rec)"/>
<path d="M670,312 H724" fill="none" stroke="#0f766e" stroke-width="3.5" marker-end="url(#arrow-rec)"/>
<path d="M920,290 C945,290 940,108 962,108" fill="none" stroke="#0f766e" stroke-width="3.5" marker-end="url(#arrow-rec)"/>
<path d="M920,334 C945,334 940,516 962,516" fill="none" stroke="#0f766e" stroke-width="3.5" marker-end="url(#arrow-rec)"/>

<path d="M920,312 H962" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-rep)"/>
<path d="M410,232 C600,232 690,236 790,264" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-rep)"/>
<path d="M410,538 C620,538 790,470 820,360" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-rep)"/>
<path d="M480,682 H245 V592" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-rep)"/>
<path d="M480,708 H38 V232 H74" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-rep)"/>
<path d="M730,682 H860 V360" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-rep)"/>

<path d="M900,616 H940" fill="none" stroke="#0f766e" stroke-width="3.5"/>
<text x="950" y="621" fill="#6a6780" font-size="13">record path</text>
<path d="M900,644 H940" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="950" y="649" fill="#6a6780" font-size="13">replay and resume path</text>
<text x="900" y="680" fill="#6a6780" font-size="13">Every Rewind box is an iii worker.</text>
<text x="900" y="698" fill="#6a6780" font-size="13">Calls between them go through</text>
<text x="900" y="716" fill="#6a6780" font-size="13">an engine.</text>
</g>
</svg>
