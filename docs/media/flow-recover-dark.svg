<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 700" width="520" height="700" role="img" aria-label="After a worker dies mid-run, you click Recover, and a copy of the agent replays the calls that finished, runs safe calls live, and waits at email::send until you mark it sent, send it or skip it." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
