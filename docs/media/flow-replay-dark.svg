<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 548" width="520" height="548" role="img" aria-label="You click Replay, Rewind starts a copy of the agent in a namespace of its own with a stub for every other function, and each call the copy makes gets the answer the recording has for it until agent::run returns." font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
